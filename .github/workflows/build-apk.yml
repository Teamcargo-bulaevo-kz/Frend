name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee gradle-test.log
          exit ${PIPESTATUS[0]}

      - name: Report test problems
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          msg=$(grep -E "^e: |FAILED|Assertion|expected|Exception|error:|What went wrong" -A2 gradle-test.log | grep -v "^--" | head -80 | cut -c1-400 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g') || true
          fails=$(grep -h "<failure" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | cut -c1-500 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g') || true
          echo "::error title=Unit tests failed::$msg%0A%0A$fails"
          exit 1

      - name: Build debug APK
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: ./gradlew assembleDebug

      - name: Check that no Groq key is inside the APK
        shell: bash
        run: |
          rm -rf /tmp/apk && mkdir /tmp/apk && unzip -q app/build/outputs/apk/debug/app-debug.apk -d /tmp/apk
          if grep -rqa "gsk_" /tmp/apk; then echo "::error::Groq key (gsk_) found in APK"; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
