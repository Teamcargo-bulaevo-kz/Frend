<!doctype html><html><head><title>Уровень</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{font-family:sans-serif;background:#171A2B;color:#F1F2F8;margin:0;padding:16px;font-size:17px}h1{font-size:20px;margin:4px 0 14px}button{font-size:18px;padding:12px;border-radius:12px;border:0;margin:4px;background:#2A2F48;color:#fff}button.p{background:#7C6CFF}input,select{font-size:18px;padding:10px;border-radius:10px;border:0;margin:4px 0;background:#22263A;color:#fff;width:100%}.card{background:#22263A;border-radius:14px;padding:14px;margin:10px 0}.big{font-size:40px;font-weight:bold;text-align:center;margin:10px 0}.row{display:flex;gap:8px}.row>*{flex:1}.dim{color:#9EA3BC;font-size:14px}</style></head><body><h1>Строительный уровень</h1>
<div style="position:relative;height:260px;background:#22263A;border-radius:130px;margin:20px auto;width:260px"><div style="position:absolute;left:125px;top:0;bottom:0;width:10px;background:#33384F"></div><div style="position:absolute;top:125px;left:0;right:0;height:10px;background:#33384F"></div>
<div id="bub" style="position:absolute;width:50px;height:50px;border-radius:25px;background:#5BD18B;left:105px;top:105px"></div></div>
<div id="v" class="big">0,0° / 0,0°</div><p class="dim">Положи телефон на поверхность. Зелёный — ровно.</p>
<script>
window.addEventListener('deviceorientation',e=>{const x=e.gamma||0,y=e.beta||0;const cx=Math.max(-100,Math.min(100,x*4)),cy=Math.max(-100,Math.min(100,y*4));bub.style.left=(105+cx)+'px';bub.style.top=(105+cy)+'px';bub.style.background=Math.abs(x)<1&&Math.abs(y)<1?'#5BD18B':'#FFD166';v.textContent=x.toFixed(1).replace('.',',')+'° / '+y.toFixed(1).replace('.',',')+'°'});
</script></body></html>
