<!doctype html><html><head><title>Жребий</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{font-family:sans-serif;background:#171A2B;color:#F1F2F8;margin:0;padding:16px;font-size:17px}h1{font-size:20px;margin:4px 0 14px}button{font-size:18px;padding:12px;border-radius:12px;border:0;margin:4px;background:#2A2F48;color:#fff}button.p{background:#7C6CFF}input,select{font-size:18px;padding:10px;border-radius:10px;border:0;margin:4px 0;background:#22263A;color:#fff;width:100%}.card{background:#22263A;border-radius:14px;padding:14px;margin:10px 0}.big{font-size:40px;font-weight:bold;text-align:center;margin:10px 0}.row{display:flex;gap:8px}.row>*{flex:1}.dim{color:#9EA3BC;font-size:14px}</style></head><body><h1>Жребий</h1>
<div id="r" class="big" style="font-size:56px">?</div>
<div class="row"><button class="p" onclick="coin()">Монетка</button><button class="p" onclick="dice()">Кубик</button></div>
<div class="card"><div class="row"><input id="a" type="number" value="1"><input id="b" type="number" value="100"></div><button class="p" style="width:100%" onclick="num()">Случайное число</button></div>
<div class="card"><input id="v" placeholder="Варианты через запятую: пицца, суши, борщ"><button class="p" style="width:100%" onclick="pick()">Выбрать</button></div>
<script>
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};const show=t=>{r.textContent=t;r.animate([{transform:'scale(.6)'},{transform:'scale(1)'}],250)};
const coin=()=>show(rnd(2)?'Орёл':'Решка');const dice=()=>show('⚀⚁⚂⚃⚄⚅'[rnd(6)]);
const num=()=>{let x=Math.min(+a.value,+b.value),y=Math.max(+a.value,+b.value);show(x+rnd(y-x+1))};
const pick=()=>{const o=v.value.split(',').map(s=>s.trim()).filter(Boolean);show(o.length?o[rnd(o.length)]:'?')};
</script></body></html>
